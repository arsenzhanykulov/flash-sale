# Локальные надстройки над docker-compose.yml.
#
# docker compose подхватывает файл docker-compose.override.yml автоматически,
# без дополнительных флагов. В git он не попадает — у каждого свои порты.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Ниже — публикация порта Postgres на хост для внешнего psql или GUI-клиента.
# В базовом compose её нет (ADR-017): приложение и тесты ходят в базу внутри
# сети compose, а занятый 5432 ломал бы запуск на чистой машине.
#
# Порт берётся из POSTGRES_PORT в .env, по умолчанию 5433 — чтобы не спорить
# с уже запущенным локальным Postgres на 5432.

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
