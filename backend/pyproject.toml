[project]
name = "flash-sale-backend"
version = "0.1.0"
description = "Flash Sale backend: FastAPI + SQLAlchemy 2 (async)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    # Валидация email в теле запроса на вход: мусор отсекается 422,
    # а не превращается в пользователя.
    "pydantic[email]>=2.9",
    # Подпись и проверка токенов доступа (HS256). Для симметричной подписи
    # не тянет cryptography, проверка exp встроена.
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.uv]
# app/ — не распространяемый пакет, ставим только зависимости.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Один event loop на весь прогон: engine кэшируется между тестами,
# при loop-per-test пул соединений оказался бы привязан к закрытому loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
